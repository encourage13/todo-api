services:        
  postgres: 
    image: postgres:17         
    container_name: todo_db  
    environment:  
      POSTGRES_USER: ${DB_USER}   
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: 
      - "127.0.0.1:5432:5432"          
    volumes: 
      - todo_pgdata:/var/lib/postgresql/data        
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:         
  todo_pgdata: