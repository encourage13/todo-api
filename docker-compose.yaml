services:        
  postgres: 
    image: postgres:17         
    container_name: todo_db  
    environment:  
      POSTGRES_USER: ${DB_USER}   
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: 
      - "127.0.0.1:5432:5432"          
    volumes: 
      - todo_pgdata:/var/lib/postgresql/data        
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    
volumes:         
  todo_pgdata: